version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # pnpm-workspace.yaml sets minimumReleaseAge to 1440 minutes, so pnpm
    # refuses a release younger than a day. Without a matching cooldown here,
    # Dependabot would open pull requests that cannot install.
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    ignore:
      # @types/node must track the runtime's major line, not the newest one.
      # Types for Node 26 describe APIs that do not exist on Node 24, so a
      # major bump would let the typecheck approve code that fails at runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
