name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Must run before setup-node so the pnpm store cache can be resolved.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      # Retrieval quality is a separate question from correctness: the suite
      # can be green while the router returns the wrong skills.
      - name: Evaluate ranking against the baseline
        run: pnpm eval

      - name: Build
        run: pnpm build

      # The unit suite calls the CLI in process, so the command it would
      # register with a client is never launched. This runs the build over real
      # stdio and then launches exactly what `install --dry-run` planned. The
      # release workflow does the same against each compiled binary, which is
      # where the interpreter and the entry point stop being what Node makes
      # them.
      - name: Speak MCP to the build and to the command it registers
        run: node scripts/smoke-test.mjs "$(command -v node)" dist/bootstrap/main.js

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
