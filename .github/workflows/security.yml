name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is caught even when nothing is
    # being pushed. Off the hour to avoid the scheduling peak.
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to read workflow run information.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves, which is where script
        # injection through untrusted inputs would live.
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Wider than the default suite: this server parses untrusted files
          # and resolves paths from agent-supplied input.
          queries: security-extended
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Compares the base and head of a pull request, so it has nothing to do on
    # a push or a schedule.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # The package is published under MIT; these would be incompatible.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-3.0
